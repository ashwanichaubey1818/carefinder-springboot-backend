spring:
  application:
    name: carefinder-backend

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carefinder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-stacktrace: never

  forward-headers-strategy: framework
  max-http-request-header-size: 16KB

  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}

  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:CareFinder}

  seed-data: ${SEED_DATA:true}
  bootstrap-admin: ${BOOTSTRAP_ADMIN:true}

  admin-email: ${ADMIN_EMAIL:admin@carefinder.local}
  admin-password: ${ADMIN_PASSWORD:ChangeMe-Admin-123!}

  staff-email: ${STAFF_EMAIL:staff@carefinder.local}
  staff-password: ${STAFF_PASSWORD:ChangeMe-Staff-Password-123!}

  auth:
    jwt-secret: ${JWT_SECRET:carefinder-local-development-secret-change-me-now}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
    reset-token-minutes: ${RESET_TOKEN_MINUTES:20}
    expose-dev-reset-token: ${EXPOSE_DEV_RESET_TOKEN:false}

logging:
  level:
    com.carefinder.backend: INFO
