spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors-origins: ${CORS_ORIGINS}
  seed-data: ${SEED_DATA:false}
  bootstrap-admin: ${BOOTSTRAP_ADMIN:false}

  auth:
    jwt-secret: ${JWT_SECRET}
    expose-dev-reset-token: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}

  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

logging:
  level:
    root: INFO
    com.carefinder.backend: INFO
